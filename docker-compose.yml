services:
  newsbot:
    build: .
    image: newsbot:latest
    container_name: newsbot
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVER_URL: http://host.docker.internal:4202/ag-ui
      APP_SERVER_TOKEN_FILE: /app/data/app_server_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    stop_grace_period: 15s
    init: true
    # Жёсткий потолок чтобы при сбое/утечке не съел всю машину
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
