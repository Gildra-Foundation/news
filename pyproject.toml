[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gildranews"
version = "0.1.0"
description = "Autonomous Telegram news aggregation and publishing bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.19",
    "apscheduler>=3.10",
    "google-genai>=0.8",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[project.scripts]
gildranews = "gildranews.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
